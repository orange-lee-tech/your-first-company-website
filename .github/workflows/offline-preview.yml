name: Export self-contained HTML previews
on:
  push:
    branches: [offline-preview-export]
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          path: company
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: orange-lee-tech/your-first-homepages
          ref: 0b80402f364a6c28b2fe05a98d37314d0c6d58b5
          path: home
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 45818991046
          name: company-website-preview
          path: offline-input/company
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare source snapshots and browser
        shell: bash
        run: |
          mkdir -p offline-input/home output
          cp -r home/*.html home/contents home/posts home/static home/LICENSE offline-input/home/
          mkdir -p offline-input/home/content
          cp -r home/content/generated offline-input/home/content/
          cd company
          npm install --prefix /tmp/preview-deps playwright@1.62.1
          cd /tmp/preview-deps
          npx playwright install --with-deps --only-shell chromium
      - name: Export and verify offline files
        run: NODE_PATH=/tmp/preview-deps/node_modules node company/scripts/export-offline-previews.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-html-previews
          path: output/*.html
          if-no-files-found: error
