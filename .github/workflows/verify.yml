name: Validate company website template
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Generate and smoke-test local HTML preview
        shell: bash
        run: |
          PORT=3100 npm run preview > /tmp/template-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; cat /tmp/template-preview.log' EXIT
          for attempt in {1..120}; do
            if curl -fsS http://127.0.0.1:3100/ -o /tmp/template-home.html; then
              test -s out/index.html
              grep -q '中南大学人工智能协会' /tmp/template-home.html
              curl -fsS http://127.0.0.1:3100/departments/technology/ -o /dev/null
              curl -fsS http://127.0.0.1:3100/services/baoyan/ -o /dev/null
              curl -fsS http://127.0.0.1:3100/demo-form.html -o /dev/null
              exit 0
            fi
            kill -0 "$preview_pid" 2>/dev/null || exit 1
            sleep 1
          done
          exit 1
      - run: npm run verify:export
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml
      - run: python scripts/build-offline-preview.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          TEST_OFFLINE_PREVIEW: "1"
      - name: Upload offline HTML
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: company-website-preview-offline
          path: preview/company-website-preview.html
          if-no-files-found: error
      - name: Upload HTML preview ZIP
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: company-website-preview
          path: out/
          if-no-files-found: error
